<app-header />

<main>
  <div id="dashboard">
    <app-server-status />

    <div class="dashboard-item">
      <article>
        <header>
          <img src="./globe.png" alt="A globe" />
          <h2>Traffic</h2>
        </header>
        <div id="traffic">
          <p>Last 7 days</p>

          <div id="chart">
            @for (dataPoint of trafficData; track dataPoint.id) {
              @if (dataPoint.value) {
                <div [style.height]="(dataPoint.value / maxTraffic) * 100 + '%'"></div>
              }
              @else {
                <div [style.height]="0 + '%'"></div>
              }
            }
          </div>
        </div>
      </article>
    </div>

    <div class="dashboard-item">
      <article>
        <header>
          <img src="./list.png" alt="A list of items" />
          <h2>Support Tickets</h2>
        </header>
        <div id="status">
          <p>Todo...</p>
        </div>
      </article>
    </div>
  </div>
</main>
