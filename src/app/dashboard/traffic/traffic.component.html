<app-dashboard-item
  title="{{title}}"
  [image]="image"
>
  <div id="traffic">
    <p>Last 7 days</p>

    <div id="chart">
      @for (dataPoint of trafficData; track dataPoint.id) {
        @if (dataPoint.value) {
          <div [style.height]="(dataPoint.value / maxTraffic) * 100 + '%'"></div>
        }
        @else {
          <div [style.height]="0 + '%'"></div>
        }
      }
    </div>
  </div>
</app-dashboard-item>
